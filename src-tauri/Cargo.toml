[package]
name = "encra"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
zeroize = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }

# XML parsing
quick-xml = "0.37"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
libc = "0.2"

# Reading 2FA QR codes from a screenshot
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = { version = "0.11", default-features = false }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Argon2 at 256 MiB is painfully slow unoptimised. Optimise the hashing crates
# even in dev builds, so dev unlocks and the test suite run the real settings.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
